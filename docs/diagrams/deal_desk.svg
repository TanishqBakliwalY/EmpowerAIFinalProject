<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9ab3"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d48a00"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1672e3"/></marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1285e9"/><stop offset="1" stop-color="#0037bf"/></linearGradient>
  </defs>
  <rect width="1400" height="600" rx="18" fill="#ffffff" stroke="#e2e8f1"/>
  <text x="28" y="40" fill="#0a2463" font-size="20" font-weight="800">Deal Desk: who hands work to whom</text>
  <text x="28" y="62" fill="#6b7b95" font-size="13">Agents choose · code counts · a person approves. Every arrow is a structured (Pydantic) hand-off; every step is traced with its token cost.</text>

  <!-- Copilot entry -->
  <rect x="20" y="86" width="256" height="52" rx="12" fill="url(#g)"/>
  <text x="148" y="108" fill="#fff" font-size="13" font-weight="750" text-anchor="middle">Emi, the Empower Copilot (chat)</text>
  <text x="148" y="126" fill="#dbe8ff" font-size="11" text-anchor="middle">start_deal · get_deal · price_what_if · email</text>
  <path d="M148 138 L 148 156 C 148 166, 217 160, 217 168" stroke="#1672e3" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>

  <g font-size="12.5" text-anchor="middle">
    <rect x="20" y="170" width="118" height="64" rx="10" fill="#f3f6fb" stroke="#cfd9e7"/>
    <text x="79" y="197" fill="#0e1b33" font-weight="700">Client request</text>
    <text x="79" y="214" fill="#6b7b95" font-size="11">email · RFP PDF · notes</text>

    <rect x="158" y="170" width="118" height="64" rx="10" fill="#e8f8fd" stroke="#00a6e4" stroke-dasharray="5 3"/>
    <text x="217" y="197" fill="#0e1b33" font-weight="700">Safety screen</text>
    <text x="217" y="214" fill="#0083b8" font-size="11">code</text>

    <rect x="296" y="170" width="118" height="64" rx="10" fill="#eef5ff" stroke="#1672e3"/>
    <text x="355" y="192" fill="#0e1b33" font-weight="700">Requirements</text>
    <text x="355" y="208" fill="#0e1b33" font-weight="700">Analyst</text>
    <text x="355" y="224" fill="#1672e3" font-size="11">agent</text>

    <rect x="434" y="170" width="118" height="64" rx="10" fill="#eef5ff" stroke="#1672e3"/>
    <text x="493" y="192" fill="#0e1b33" font-weight="700">Solution</text>
    <text x="493" y="208" fill="#0e1b33" font-weight="700">Architect</text>
    <text x="493" y="224" fill="#1672e3" font-size="11">agent</text>

    <rect x="572" y="170" width="118" height="64" rx="10" fill="#eef5ff" stroke="#1672e3"/>
    <text x="631" y="197" fill="#0e1b33" font-weight="700">Estimator</text>
    <text x="631" y="214" fill="#1672e3" font-size="11">agent</text>

    <rect x="710" y="128" width="130" height="58" rx="10" fill="#f3efff" stroke="#6a4fd6"/>
    <text x="775" y="152" fill="#0e1b33" font-weight="700">Staffing Planner</text>
    <text x="775" y="170" fill="#6a4fd6" font-size="11">agent · then ↓</text>
    <path d="M775 188 L 775 214" stroke="#6a4fd6" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="710" y="218" width="130" height="58" rx="10" fill="#f3efff" stroke="#6a4fd6"/>
    <text x="775" y="242" fill="#0e1b33" font-weight="700">Pricing Strategist</text>
    <text x="775" y="260" fill="#6a4fd6" font-size="11">agent · reads the schedule</text>

    <rect x="862" y="170" width="104" height="64" rx="10" fill="#e8f8fd" stroke="#00a6e4" stroke-dasharray="5 3"/>
    <text x="914" y="194" fill="#0e1b33" font-weight="700">Orchestrator</text>
    <text x="914" y="210" fill="#0083b8" font-size="11">code · reconciles,</text>
    <text x="914" y="224" fill="#0083b8" font-size="11">routes conflicts</text>

    <rect x="986" y="170" width="104" height="64" rx="10" fill="#eef5ff" stroke="#1672e3"/>
    <text x="1038" y="197" fill="#0e1b33" font-weight="700">Deal Critic</text>
    <text x="1038" y="214" fill="#1672e3" font-size="11">agent · red team</text>

    <rect x="1110" y="170" width="112" height="64" rx="10" fill="#eef5ff" stroke="#1672e3"/>
    <text x="1166" y="192" fill="#0e1b33" font-weight="700">Proposal</text>
    <text x="1166" y="208" fill="#0e1b33" font-weight="700">Writer</text>
    <text x="1166" y="224" fill="#1672e3" font-size="11">agent · no tools</text>

    <rect x="1242" y="170" width="138" height="64" rx="10" fill="#e8f8fd" stroke="#00a6e4" stroke-dasharray="5 3"/>
    <text x="1311" y="197" fill="#0e1b33" font-weight="700">Leak guard</text>
    <text x="1311" y="214" fill="#0083b8" font-size="11">code</text>

    <rect x="1242" y="282" width="138" height="58" rx="10" fill="#fff6e6" stroke="#e0a52d"/>
    <text x="1311" y="306" fill="#0e1b33" font-weight="700">Human decision</text>
    <text x="1311" y="323" fill="#b86e00" font-size="11">Director for off-policy</text>
  </g>

  <g stroke="#8a9ab3" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="138" y1="202" x2="156" y2="202"/>
    <line x1="276" y1="202" x2="294" y2="202"/>
    <line x1="414" y1="202" x2="432" y2="202"/>
    <line x1="552" y1="202" x2="570" y2="202"/>
    <path d="M690 202 C 700 202, 700 157, 708 157"/>
    <path d="M690 202 C 700 202, 700 247, 708 247"/>
    <path d="M840 157 C 852 157, 850 202, 860 202"/>
    <path d="M840 247 C 852 247, 850 202, 860 202"/>
    <line x1="966" y1="202" x2="984" y2="202"/>
    <line x1="1090" y1="202" x2="1108" y2="202"/>
    <line x1="1222" y1="202" x2="1240" y2="202"/>
    <line x1="1311" y1="234" x2="1311" y2="280"/>
  </g>

  <path d="M1038 234 C 1038 312, 900 312, 640 312 C 631 312, 631 280, 631 238" stroke="#d48a00" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <path d="M760 312 L 760 280" stroke="#d48a00" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <path d="M640 312 C 520 312, 493 300, 493 238" stroke="#d48a00" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
  <text x="820" y="334" fill="#b86e00" font-size="12" text-anchor="middle">capacity / deadline / budget conflict with no fitting option: the Orchestrator sends it back to the Architect once (else the Critic sends fixable HIGH issues back once); everything downstream re-runs</text>

  <text x="28" y="378" fill="#33435f" font-size="13" font-weight="700">Read-only tools (least privilege: each agent gets only its own)</text>
  <rect x="20" y="388" width="1360" height="56" rx="10" fill="#f7f9fd" stroke="#e2e8f1"/>
  <text x="36" y="410" font-size="11.5" fill="#33435f"><tspan fill="#1672e3" font-weight="700">Analyst</tspan> lookup_client, list_module_catalog  ·  <tspan fill="#1672e3" font-weight="700">Architect</tspan> find_similar_projects, skills_inventory, check_capability  ·  <tspan fill="#1672e3" font-weight="700">Estimator</tspan> module_benchmarks, estimation_track_record, project_breakdown</text>
  <text x="36" y="431" font-size="11.5" fill="#33435f"><tspan fill="#6a4fd6" font-weight="700">Staffing</tspan> required_hours, suggest_team, find_people, person_schedule, simulate_schedule  ·  <tspan fill="#6a4fd6" font-weight="700">Pricing</tspan> get_rate_card, pricing_history, quote_calculator  ·  <tspan fill="#1672e3" font-weight="700">Critic</tspan> deal_checks, compliance_checklist  ·  <tspan fill="#1672e3" font-weight="700">Writer</tspan> none</text>

  <g font-size="12">
    <rect x="20" y="458" width="440" height="126" rx="12" fill="#f7f9fd" stroke="#e2e8f1"/>
    <text x="38" y="482" fill="#0a2463" font-weight="800" font-size="13.5">Company data (one folder, swappable)</text>
    <text x="38" y="503" fill="#33435f">• 54 people: role, level, office, skills, loaded cost (internal)</text>
    <text x="38" y="521" fill="#33435f">• assignments + leave → week-by-week availability</text>
    <text x="38" y="539" fill="#33435f">• 30 past projects: estimated vs ACTUAL hours by module × role</text>
    <text x="38" y="557" fill="#33435f">• rate card + pricing policy · compliance rules · lost deals</text>
    <text x="38" y="575" fill="#6b7b95" font-size="11">demo = synthetic data/seed · real = EMPOWER_DATA_DIR</text>

    <rect x="480" y="458" width="440" height="126" rx="12" fill="#eef5ff" stroke="#c6dcfa"/>
    <text x="498" y="482" fill="#0a2463" font-weight="800" font-size="13.5">Calculators: code does the math</text>
    <text x="498" y="503" fill="#33435f">• +10% PM, +6% lead, ≥20% QA, 10/15/25% contingency</text>
    <text x="498" y="521" fill="#33435f">• schedule from real free capacity → go-live, bottleneck</text>
    <text x="498" y="539" fill="#33435f">• fixed + T&amp;M price, milestones, margin vs 35% floor</text>
    <text x="498" y="557" fill="#33435f">• discount capped by policy · Phase-1 (must-haves) price</text>
    <text x="498" y="575" fill="#6b7b95" font-size="11">a prompt can't "set the price": no agent writes a final number</text>

    <rect x="940" y="458" width="440" height="126" rx="12" fill="#fff8ea" stroke="#f0d49a"/>
    <text x="958" y="482" fill="#0a2463" font-weight="800" font-size="13.5">Safety and spend limits</text>
    <text x="958" y="503" fill="#33435f">• hidden text &amp; invisible PDF text removed; injections flagged</text>
    <text x="958" y="521" fill="#33435f">• leak guard: salaries · costs · margins · prompt canary</text>
    <text x="958" y="539" fill="#33435f">• per run: 70 model calls · 100 tool calls · 600k tokens</text>
    <text x="958" y="557" fill="#33435f">• $5/day budget · rate limits · sign-in with roles</text>
    <text x="958" y="575" fill="#6b7b95" font-size="11">gpt-6-luna via Portkey · prompt-cache key per agent</text>
  </g>
</svg>
