<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1285e9"/><stop offset="1" stop-color="#0037bf"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a9ab3"/></marker>
  </defs>
  <rect width="1400" height="640" rx="18" fill="#ffffff" stroke="#e2e8f1"/>
  <text x="28" y="40" fill="#0a2463" font-size="20" font-weight="800">Empower Ops Agents: one platform, eight modules, 25 agents, one shared core</text>
  <text x="28" y="62" fill="#6b7b95" font-size="13">Every module uses the same company data, agent runner, token ledger, guardrails and spend limits. A person signs in with a role and approves every decision.</text>

  <!-- people -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="300" y="84" width="230" height="44" rx="22" fill="#fff6e6" stroke="#e0a52d"/>
    <text x="415" y="111" fill="#0e1b33" font-weight="700">Director: everything + approvals</text>
    <rect x="585" y="84" width="230" height="44" rx="22" fill="#fff6e6" stroke="#e0a52d"/>
    <text x="700" y="111" fill="#0e1b33" font-weight="700">Sales &amp; delivery</text>
    <rect x="870" y="84" width="230" height="44" rx="22" fill="#fff6e6" stroke="#e0a52d"/>
    <text x="985" y="111" fill="#0e1b33" font-weight="700">HR</text>
  </g>
  <rect x="200" y="146" width="1000" height="34" rx="8" fill="#f3f6fb" stroke="#cfd9e7"/>
  <text x="700" y="168" fill="#33435f" font-size="12.5" text-anchor="middle" font-weight="650">Home dashboard · Agent Activity · Evaluation · audit trail · roles checked on every API route · hashed passwords</text>
  <g stroke="#8a9ab3" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="415" y1="128" x2="415" y2="144"/><line x1="700" y1="128" x2="700" y2="144"/><line x1="985" y1="128" x2="985" y2="144"/>
    <line x1="700" y1="180" x2="700" y2="198"/>
  </g>

  <!-- modules -->
  <g font-size="12">
    <rect x="20" y="200" width="216" height="210" rx="14" fill="url(#g)"/>
    <text x="36" y="228" fill="#fff" font-size="15" font-weight="800">Deal Desk</text>
    <text x="36" y="246" fill="#dbe8ff">email / RFP PDF → proposal</text>
    <text x="36" y="267" fill="#fff">• Requirements Analyst</text>
    <text x="36" y="283" fill="#fff">• Solution Architect</text>
    <text x="36" y="299" fill="#fff">• Estimator</text>
    <text x="36" y="315" fill="#fff">• Staffing Planner ∥ Pricing</text>
    <text x="36" y="331" fill="#fff">• Deal Critic (sends back once)</text>
    <text x="36" y="347" fill="#fff">• Proposal Writer (no tools)</text>
    <text x="36" y="368" fill="#ffd979" font-weight="700">Deal Room: Client ⇄ Negotiator</text>
    <text x="36" y="384" fill="#ffd979">  + Coach; code referees offers</text>
    <text x="36" y="402" fill="#bcd3ff" font-size="11">Director · Sales</text>

    <rect x="250" y="200" width="216" height="210" rx="14" fill="#eef5ff" stroke="#1672e3"/>
    <text x="266" y="228" fill="#0a2463" font-size="15" font-weight="800">Emi (Copilot)</text>
    <text x="266" y="248" fill="#5b6b85">chat over all of it</text>
    <text x="266" y="276" fill="#33435f">• Emi: start deals</text>
    <text x="266" y="295" fill="#33435f">  from PDFs, explain, what-if</text>
    <text x="266" y="314" fill="#33435f">  prices, staffing questions</text>
    <text x="266" y="333" fill="#33435f">• Email Writer (client-safe</text>
    <text x="266" y="352" fill="#33435f">  view + leak guard)</text>
    <text x="266" y="371" fill="#33435f">• grounding validator</text>
    <text x="266" y="396" fill="#1672e3" font-size="11">Director · Sales</text>

    <rect x="480" y="200" width="216" height="210" rx="14" fill="#eef5ff" stroke="#1672e3"/>
    <text x="496" y="226" fill="#0a2463" font-size="15" font-weight="800">Delivery</text>
    <text x="496" y="246" fill="#5b6b85">Scope Guard: ask vs signed SOW</text>
    <text x="496" y="265" fill="#33435f">• Request Splitter, Scope Matcher</text>
    <text x="496" y="282" fill="#33435f">  (cites clauses), CR Estimator,</text>
    <text x="496" y="299" fill="#33435f">  Reply Drafter; code prices CRs</text>
    <text x="496" y="324" fill="#5b6b85">Project Health: active projects</text>
    <text x="496" y="343" fill="#33435f">• code: CPI/SPI, milestones, deps</text>
    <text x="496" y="362" fill="#33435f">• Delivery Risk Agent</text>
    <text x="496" y="396" fill="#1672e3" font-size="11">Director · Sales</text>

    <rect x="710" y="200" width="216" height="210" rx="14" fill="#f3efff" stroke="#6a4fd6"/>
    <text x="726" y="228" fill="#0a2463" font-size="15" font-weight="800">Staffing</text>
    <text x="726" y="248" fill="#5b6b85">who is free, when</text>
    <text x="726" y="276" fill="#33435f">• 12-week availability board</text>
    <text x="726" y="295" fill="#33435f">• Staffing Assistant (Q&amp;A)</text>
    <text x="726" y="314" fill="#33435f">• shared tools used by the</text>
    <text x="726" y="333" fill="#33435f">  Deal Desk and Bench</text>
    <text x="726" y="396" fill="#6a4fd6" font-size="11">everyone</text>

    <rect x="940" y="200" width="216" height="210" rx="14" fill="#f3efff" stroke="#6a4fd6"/>
    <text x="956" y="228" fill="#0a2463" font-size="15" font-weight="800">Bench Optimizer</text>
    <text x="956" y="248" fill="#5b6b85">roll-offs → deals, courses</text>
    <text x="956" y="276" fill="#33435f">• Matcher (pipeline + internal)</text>
    <text x="956" y="295" fill="#33435f">• Upskilling Planner</text>
    <text x="956" y="314" fill="#33435f">• Bench Brief for the director</text>
    <text x="956" y="333" fill="#33435f">• code: bench cost, validation</text>
    <text x="956" y="396" fill="#6a4fd6" font-size="11">Director · HR</text>

    <rect x="1170" y="200" width="210" height="210" rx="14" fill="#f3efff" stroke="#6a4fd6"/>
    <text x="1186" y="228" fill="#0a2463" font-size="15" font-weight="800">Appraisals &amp; Hikes</text>
    <text x="1186" y="248" fill="#5b6b85">fixed pool, fair split</text>
    <text x="1186" y="276" fill="#33435f">• Calibration Analyst</text>
    <text x="1186" y="295" fill="#33435f">• Hike Strategist</text>
    <text x="1186" y="314" fill="#33435f">• Fairness Auditor (sends back)</text>
    <text x="1186" y="333" fill="#33435f">• Manager Brief Writer</text>
    <text x="1186" y="352" fill="#33435f">• code: optimizer to the pool</text>
    <text x="1186" y="396" fill="#6a4fd6" font-size="11">Director · HR</text>
  </g>

  <!-- core -->
  <text x="28" y="446" fill="#0a2463" font-size="14" font-weight="800">Shared core</text>
  <g font-size="12">
    <rect x="20" y="458" width="262" height="160" rx="12" fill="#f7f9fd" stroke="#e2e8f1"/>
    <text x="36" y="482" fill="#0a2463" font-weight="800">Company data</text>
    <text x="36" y="503" fill="#33435f">people, skills, assignments, leave</text>
    <text x="36" y="521" fill="#33435f">past projects: estimate vs actual</text>
    <text x="36" y="539" fill="#33435f">rate card, policy, compliance</text>
    <text x="36" y="557" fill="#33435f">SOWs, appraisal inputs, courses</text>
    <text x="36" y="584" fill="#6b7b95" font-size="11">synthetic demo; real data = one</text>
    <text x="36" y="600" fill="#6b7b95" font-size="11">folder via EMPOWER_DATA_DIR</text>

    <rect x="296" y="458" width="262" height="160" rx="12" fill="#eef5ff" stroke="#c6dcfa"/>
    <text x="312" y="482" fill="#0a2463" font-weight="800">Agent runner + token ledger</text>
    <text x="312" y="503" fill="#33435f">pydantic-ai, structured outputs</text>
    <text x="312" y="521" fill="#33435f">every tool call traced</text>
    <text x="312" y="539" fill="#33435f">input / cached / output tokens</text>
    <text x="312" y="557" fill="#33435f">and $ per agent, per run</text>
    <text x="312" y="584" fill="#6b7b95" font-size="11">gpt-6-luna · prompt-cache keys</text>

    <rect x="572" y="458" width="262" height="160" rx="12" fill="#eef5ff" stroke="#c6dcfa"/>
    <text x="588" y="482" fill="#0a2463" font-weight="800">Calculators (code does math)</text>
    <text x="588" y="503" fill="#33435f">estimate overheads, schedule</text>
    <text x="588" y="521" fill="#33435f">prices, margins, Phase 1</text>
    <text x="588" y="539" fill="#33435f">CR pricing, bench cost</text>
    <text x="588" y="557" fill="#33435f">hike optimizer, fairness gaps</text>

    <rect x="848" y="458" width="262" height="160" rx="12" fill="#fff8ea" stroke="#f0d49a"/>
    <text x="864" y="482" fill="#0a2463" font-weight="800">Guardrails</text>
    <text x="864" y="503" fill="#33435f">hidden-text + injection screen</text>
    <text x="864" y="521" fill="#33435f">invisible PDF text removed</text>
    <text x="864" y="539" fill="#33435f">leak guard + prompt canary</text>
    <text x="864" y="557" fill="#33435f">grounding validator (chat)</text>

    <rect x="1124" y="458" width="256" height="160" rx="12" fill="#fff8ea" stroke="#f0d49a"/>
    <text x="1140" y="482" fill="#0a2463" font-weight="800">Spend limits</text>
    <text x="1140" y="503" fill="#33435f">per run: calls, tools, tokens</text>
    <text x="1140" y="521" fill="#33435f">per message (Copilot)</text>
    <text x="1140" y="539" fill="#33435f">$5/day budget, rate limits</text>
    <text x="1140" y="557" fill="#33435f">one revision round max</text>
  </g>
</svg>
